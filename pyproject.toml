[project]
name = "gptoken"
version = "5.1.1"
description = "Local Windows Codex quota widget by VLADMACC"
requires-python = ">=3.12"
license = "LicenseRef-VLADMACC-Proprietary"
dependencies = ["Pillow==13.0.0"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-include = ["*.pyw"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
